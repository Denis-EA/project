site_name: "Python для аналитиков: с нуля до первых проектов"
site_url: "https://your-client-site.com"
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: overrides

nav:
  - Главная: index.md
  - Программа курса: program.md
  - Об авторе: about.md
  - Контакты: contact.md
  - Уроки:
      - Урок 1. Введение в Python: lessons/lesson-01.md
      - Урок 2. Типы данных: lessons/lesson-02.md
      - Урок 3. Циклы и условия: lessons/lesson-03.md

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  