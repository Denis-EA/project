site_name: "Тестирование ПО: с нуля до эксперта"
site_url: "https://glivero.github.io/project/"
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Тёмная тема
    - scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/toggle-switch
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: overrides

nav:
  - Главная: index.md
  - Программа курса: program.md
  - Об авторе: about.md
  - Контакты: contact.md
  - Уроки:
      - Урок 1. Введение в тестирование: lessons/lesson-01.md
      - Урок 2. Тест-дизайн и чек-листы: lessons/lesson-02.md
      - Урок 3. Баг-репорты и Jira: lessons/lesson-03.md

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg